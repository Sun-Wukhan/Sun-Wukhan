name: Generate Pac-Man

on:
  schedule:
    # Regenerate once a day (UTC)
    - cron: "0 0 * * *" # Runs at 00:00
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: Sun-Wukhan
      - name: Push SVGs to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true
